openapi: 3.1.0
info:
  title: ferry audit API
  version: 1.0.0-draft
  summary: Read-only access to ferry's audit trail (proposed, not implemented).
  description: |
    **Status: proposed.** This is the contract from
    [RFC 0001](../rfcs/0001-audit-trail.md). No part of it is implemented yet.

    The API serves ferry's append-only, hash-chained audit log, and views computed from it:
    changes (PRs and MRs), plans, applies, operator runs, inventory history, diff artifacts and
    checkpoints.

    **Authentication** uses the `ferry run` identity: a bearer JWT from `FERRY_RUN_OIDC_ISSUER`
    for `FERRY_RUN_OIDC_AUDIENCE`, checked by the same verifier. **Authorization** is a separate
    read role, set with `FERRY_AUDIT_READ_SUBJECTS` and `FERRY_AUDIT_READ_GROUPS`. Being allowed to
    run doesn't grant read, and being allowed to read doesn't grant runs. The API answers 404 to
    every path unless it is configured.

    **Errors** have the same shape as the run API's, `{"error": "..."}`, plus a fixed `code`.
    Error text is short and never echoes upstream bodies.

    **Pagination** uses an opaque `cursor`. `next_cursor` is `null` on the last page. Cursors
    encode a position in the chain, so they stay valid while new events are appended.

    **Times** are RFC 3339 in UTC with milliseconds. **SHAs** are full 40-character hex.
    **Hashes** are `sha256:` followed by 64 hex characters.

    The service never verifies its own log. Clients verify with `ferry audit verify`, from
    `GET /events` and `GET /audit/checkpoint`, against a public key they have pinned.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: |
      Relative to the ferry service, for example `https://ferry.example.com/api/v1`. Keep it on an
      internal network.
security:
  - identityToken: []
tags:
  - name: changes
    description: The history of one PR or MR
  - name: plans
    description: Plans and what they pinned
  - name: applies
    description: Applies, the plan each consumed, and the plan-versus-apply verdict
  - name: runs
    description: Operator runs (`ferry run`)
  - name: events
    description: The raw event log
  - name: inventories
    description: Per-inventory history
  - name: artifacts
    description: Content-addressed diff and config artifacts
  - name: audit
    description: Checkpoints and keys, for verification

paths:
  /changes/{number}:
    get:
      operationId: getChange
      tags: [changes]
      summary: The full history of one PR or MR
      description: |
        Every plan, apply, approval observation, lock event and verdict for the change, with its
        `change_ref`. `number` is the PR or MR number on the service's repository.
      parameters:
        - $ref: '#/components/parameters/ChangeNumber'
      responses:
        '200':
          description: The change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
              examples:
                applied:
                  $ref: '#/components/examples/ChangeApplied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /plans/{plan_id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: One plan
      description: |
        What the plan pinned (head and base SHA, config digest, scope, policy result,
        `change_ref`), its per-host results with diff hashes and artifact links, its status, and
        every apply that consumed it.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                completed:
                  $ref: '#/components/examples/PlanCompleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /applies/{apply_id}:
    get:
      operationId: getApply
      tags: [applies]
      summary: One apply
      description: |
        The plan it consumed, the approvals that counted, the gate result, per-host results with
        diff hashes and artifact links, and the `plan_matches_apply` verdict.
      parameters:
        - $ref: '#/components/parameters/ApplyId'
      responses:
        '200':
          description: The apply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apply'
              examples:
                diverged:
                  $ref: '#/components/examples/ApplyDiverged'
                refused:
                  $ref: '#/components/examples/ApplyRefused'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /runs/{run_id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: One operator run
      description: |
        The identity (including a delegating agent, if the token had an `act` claim), intent,
        certificate serial and expiry, lease and finish. Results reported by the client are
        marked `asserted_by_client`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                agent:
                  $ref: '#/components/examples/RunByAgent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Events, filtered, with cursor pagination
      description: |
        Raw events. With `order=seq` and no filter other than `after_seq`, the pages form a
        contiguous segment of the chain that `ferry audit verify` can check. With other filters
        the result is a report: it has gaps in `seq`, and doesn't verify on its own.

        Filters combine with AND. `type` may be repeated, and those values combine with OR.
      parameters:
        - name: since
          in: query
          description: Events at or after this time (inclusive)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Events before this time (exclusive)
          schema:
            type: string
            format: date-time
        - name: after_seq
          in: query
          description: Events with a `seq` greater than this
          schema:
            type: integer
            minimum: 0
        - name: inventory
          in: query
          schema:
            $ref: '#/components/schemas/InventoryName'
        - name: change
          in: query
          description: A PR or MR number
          schema:
            type: integer
            minimum: 1
        - name: change_ref
          in: query
          description: An exact `change_ref` value
          schema:
            $ref: '#/components/schemas/ChangeRefValue'
        - name: type
          in: query
          description: One or more event types
          style: form
          explode: true
          schema:
            type: array
            maxItems: 32
            items:
              $ref: '#/components/schemas/EventType'
        - name: actor
          in: query
          description: An actor id (`act_…`)
          schema:
            $ref: '#/components/schemas/ActorId'
        - name: plan_id
          in: query
          schema:
            $ref: '#/components/schemas/PlanId'
        - name: apply_id
          in: query
          schema:
            $ref: '#/components/schemas/ApplyId'
        - name: run_id
          in: query
          schema:
            $ref: '#/components/schemas/RunId'
        - name: order
          in: query
          description: '`seq` is oldest first, `-seq` newest first'
          schema:
            type: string
            enum: [seq, -seq]
            default: -seq
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
              examples:
                approvals:
                  $ref: '#/components/examples/EventPageApprovals'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /inventories/{name}/history:
    get:
      operationId: getInventoryHistory
      tags: [inventories]
      summary: One inventory's history, newest first
      description: Plans, applies, drift runs, operator runs and lock changes for one inventory.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/InventoryName'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [plan, apply, drift, run, lock]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryHistoryPage'
              examples:
                prod:
                  $ref: '#/components/examples/InventoryHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /artifacts/{sha256}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: One content-addressed artifact
      description: |
        A per-host redacted result (`ferry.audit.host-result/v1`) or a `ferry.yaml` text
        (`ferry.audit.config/v1`). The SHA-256 of the response body equals `sha256`.
        Answers 410 if retention removed it. Its hash stays in the chain.
      parameters:
        - name: sha256
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: The artifact, byte for byte as stored
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HostResultArtifact'
                  - $ref: '#/components/schemas/ConfigArtifact'
              examples:
                host:
                  $ref: '#/components/examples/HostArtifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /audit/checkpoint:
    get:
      operationId: getCheckpoint
      tags: [audit]
      summary: The latest checkpoint, or the one at a given seq
      description: |
        A checkpoint fixes the chain head (`seq`, `hash`) at a point in time. With a signing key
        configured it is signed with Ed25519 over its canonical JSON without `signature`.

        Verify flow: fetch a checkpoint and store it outside ferry. Later, page through
        `GET /events?order=seq` up to its `seq`, recompute the chain, and compare the hash at that
        `seq`. Check the signature against a public key you pinned. `GET /audit/keys` is a
        convenience, not a root of trust.
      parameters:
        - name: seq
          in: query
          description: The checkpoint that covers exactly this `seq`. Omit for the latest.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
              examples:
                signed:
                  $ref: '#/components/examples/CheckpointSigned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /audit/keys:
    get:
      operationId: listCheckpointKeys
      tags: [audit]
      summary: Checkpoint public keys, current and retired
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
              examples:
                one:
                  value:
                    keys:
                      - key_id: 'ed25519:3a7f9c0e'
                        alg: Ed25519
                        public_key: MCowBQYDK2VwAyEAGb9ECWmEzf6FQbrBZ9w7lshQhqowtrbLDFw4rXAxZuE=
                        first_used: '2026-11-25T00:00:00.000Z'
                        last_used: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    identityToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An RS256 identity JWT from `FERRY_RUN_OIDC_ISSUER` with audience `FERRY_RUN_OIDC_AUDIENCE`,
        whose `sub` is in `FERRY_AUDIT_READ_SUBJECTS` or one of whose `groups` is in
        `FERRY_AUDIT_READ_GROUPS`.

  parameters:
    ChangeNumber:
      name: number
      in: path
      required: true
      description: The PR or MR number
      schema:
        type: integer
        minimum: 1
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlanId'
    ApplyId:
      name: apply_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApplyId'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RunId'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      description: '`next_cursor` from the previous page, with the same filters'
      schema:
        type: string
        maxLength: 512

  responses:
    BadRequest:
      description: A malformed id, filter or cursor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid cursor
            code: bad_request
    Unauthorized:
      description: No identity token, or an invalid one
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid identity token
            code: unauthenticated
    Forbidden:
      description: The identity has no read role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: subject not allowed to read the audit
            code: forbidden
    NotFound:
      description: No such record, or the API isn't configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
            code: not_found
    Gone:
      description: The record existed and was removed by retention or redaction. Its hash stays in the chain.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: artifact removed by retention
            code: gone
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: too many requests
            code: rate_limited
    Unavailable:
      description: The audit store or the identity issuer can't be reached. ferry fails closed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: audit unavailable
            code: unavailable

  schemas:
    Error:
      type: object
      required: [error, code]
      additionalProperties: false
      properties:
        error:
          type: string
          maxLength: 200
          description: Short, fixed text. Never echoes upstream bodies.
        code:
          type: string
          enum: [bad_request, unauthenticated, forbidden, not_found, gone, rate_limited, unavailable]

    # ---- ids and scalars ---------------------------------------------------------------------
    PlanId:
      type: string
      pattern: '^pln_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [pln_01JDX7ZK3A9B8C7D6E5F4G3H2J]
    ApplyId:
      type: string
      pattern: '^apl_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [apl_01JDX8KQ5M4N3P2Q1R0S9T8V7W]
    EventId:
      type: string
      pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
    ActorId:
      type: string
      pattern: '^act_[0-9A-HJKMNP-TV-Z]{26}$'
    ChainId:
      type: string
      pattern: '^chn_[0-9A-HJKMNP-TV-Z]{26}$'
    CheckpointId:
      type: string
      pattern: '^ckp_[0-9A-HJKMNP-TV-Z]{26}$'
    RunId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: The existing `ferry run` id
    Sha:
      type: string
      pattern: '^[0-9a-f]{40}$'
    Hash:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    ConfigDigest:
      type: object
      required: [sha256, short]
      additionalProperties: false
      properties:
        sha256:
          $ref: '#/components/schemas/Hash'
        short:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: The 16-character prefix carried by the plan record (today's `config` field)
        artifact:
          $ref: '#/components/schemas/ArtifactRef'
    InventoryName:
      type: string
      minLength: 1
      maxLength: 128
    ChangeRefValue:
      type: string
      minLength: 1
      maxLength: 256
      description: No control characters. A URL must be https.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC, milliseconds
    DurationMs:
      type: integer
      minimum: 0

    # ---- shared objects ----------------------------------------------------------------------
    ChangeKey:
      type: object
      required: [backend, repository, number]
      additionalProperties: false
      properties:
        backend:
          type: string
          enum: [github, gitlab]
        repository:
          type: string
          description: OWNER/NAME on GitHub, the project path on GitLab
        number:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri

    ChangeRef:
      type: object
      required: [value, source]
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/ChangeRefValue'
        source:
          type: string
          enum: [description_trailer, cli_flag]
        verified:
          type: boolean
          const: false
          description: ferry checks the format only. The value is the change author's claim.
        matches_plan:
          type: [boolean, 'null']
          description: On an apply, whether the plan pinned the same value. `null` when there is no plan.

    Actor:
      type: object
      required: [id, kind, via]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ActorId'
        kind:
          type: string
          enum: [human, agent, service, unknown]
        via:
          type: string
          enum: [comment, review, push, webhook, cli, schedule, service]
        login:
          type: [string, 'null']
          description: The code host login, for code host actors
        issuer:
          type: [string, 'null']
          format: uri
          description: The identity issuer, for token-authenticated actors
        subject:
          type: [string, 'null']
          description: The token's `sub`, or the `act.sub` of a delegating agent
        display_name:
          type: [string, 'null']
        redacted:
          type: boolean
          description: The identity was erased. Only `id`, `kind` and `via` remain.
        on_behalf_of:
          $ref: '#/components/schemas/Actor'
        claimed_requester:
          type: [string, 'null']
          description: A `Requested-By` trailer on an agent's PR. The agent's own claim, never verified.
        agent_run:
          type: [string, 'null']
          format: uri
          description: An `Agent-Run` trailer on an agent's PR. The agent's own claim, never verified.

    Text:
      type: object
      description: |
        Free text held outside the chain. The event holds `commitment`, which is
        SHA-256(salt ‖ UTF-8(text)). After erasure `text` is null and `redacted` is true.
      required: [commitment, redacted]
      additionalProperties: false
      properties:
        commitment:
          $ref: '#/components/schemas/Hash'
        redacted:
          type: boolean
        text:
          type: [string, 'null']
          maxLength: 1024
        salt:
          type: [string, 'null']
          description: Base64, 16 bytes. Returned so clients can check the commitment.

    ArtifactRef:
      type: object
      required: [sha256, bytes, stored]
      additionalProperties: false
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bytes:
          type: integer
          minimum: 0
        stored:
          type: boolean
          description: False if storing diffs is off, or retention removed it
        truncated:
          type: boolean
        url:
          type: string
          description: Relative to the API base, for example `/artifacts/a91f…`

    Scope:
      type: object
      required: [limit, everything, noop]
      additionalProperties: false
      properties:
        limit:
          type: [string, 'null']
          description: The `--limit` used, or null for every host
        everything:
          type: boolean
        noop:
          type: boolean
        reasons:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [file, why]
            additionalProperties: false
            properties:
              file:
                type: string
              why:
                type: string

    PolicyResult:
      type: object
      required: [passed]
      additionalProperties: false
      properties:
        passed:
          type: boolean
        violations:
          type: array
          items:
            type: string

    Totals:
      type: object
      additionalProperties: false
      properties:
        hosts:
          type: integer
          minimum: 0
        ok:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unreachable:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0

    TaskChange:
      type: object
      required: [key, status, diff_hash]
      additionalProperties: false
      properties:
        key:
          type: string
          description: '`role/task name#occurrence` on this host. Ansible has no stable task id.'
        status:
          type: string
          enum: [changed, failed, unreachable, blocked, skipped_in_check_mode]
        diff_hash:
          $ref: '#/components/schemas/Hash'
        no_log:
          type: boolean

    HostResult:
      type: object
      required: [host, state, changed_tasks, failed_tasks, diff_hash]
      additionalProperties: false
      properties:
        host:
          type: string
        state:
          type: string
          enum: [ok, changed, failed, unreachable, blocked]
        ok_tasks:
          type: integer
          minimum: 0
        changed_tasks:
          type: integer
          minimum: 0
        failed_tasks:
          type: integer
          minimum: 0
        skipped_tasks:
          type: integer
          minimum: 0
        unreachable:
          type: boolean
        blocked_reason:
          type: [string, 'null']
        changes:
          type: array
          items:
            $ref: '#/components/schemas/TaskChange'
        diff_hash:
          $ref: '#/components/schemas/Hash'
        artifact:
          $ref: '#/components/schemas/ArtifactRef'

    Divergence:
      type: object
      required: [host, kind]
      additionalProperties: false
      properties:
        host:
          type: string
        kind:
          type: string
          enum: [host_unplanned, host_not_applied, task_unplanned, task_not_applied, diff_mismatch,
                 check_mode_skipped, host_failed]
        task:
          type: [string, 'null']
        planned_hash:
          oneOf:
            - $ref: '#/components/schemas/Hash'
            - type: 'null'
        applied_hash:
          oneOf:
            - $ref: '#/components/schemas/Hash'
            - type: 'null'

    Verdict:
      type: object
      description: '`plan_matches_apply`. Evidence for a reviewer, not a gate.'
      required: [algorithm, result, divergences]
      additionalProperties: false
      properties:
        algorithm:
          type: string
          const: ferry.verdict/v1
        result:
          type: string
          enum: [match, diverged, incomplete, unverifiable]
        unverifiable_because:
          type: [string, 'null']
          enum: [plan_predates_audit, plan_pruned, operator_run, no_plan, null]
        divergences:
          type: array
          items:
            $ref: '#/components/schemas/Divergence'

    Approval:
      type: object
      required: [event_id, approver, head_sha, head_source, counted, reason, observed_at]
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        approver:
          $ref: '#/components/schemas/Actor'
        approved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        head_sha:
          oneOf:
            - $ref: '#/components/schemas/Sha'
            - type: 'null'
          description: The head the approval is for, or null if ferry couldn't tell
        head_source:
          type: string
          enum: [review_commit, approved_at_after_head, reset_on_push, unknown]
        counted:
          type: boolean
        reason:
          type: string
          enum: [counted, not_head, author, contributor, no_write_access, bot, contributors_unknown,
                 head_unknown]
        observed_at:
          $ref: '#/components/schemas/Timestamp'

    GateResult:
      type: object
      required: [passed, reasons]
      additionalProperties: false
      properties:
        passed:
          type: boolean
        stage:
          type: [string, 'null']
          enum: [precheck, recheck, null]
          description: Where a refusal happened. The precheck is before credentials, the recheck after.
        reasons:
          type: array
          description: As posted on the change, after the redactor
          items:
            type: string
            maxLength: 2000

    PlanSummary:
      type: object
      required: [plan_id, status, inventory, head_sha, requested_at]
      additionalProperties: false
      properties:
        plan_id:
          $ref: '#/components/schemas/PlanId'
        status:
          $ref: '#/components/schemas/PlanStatus'
        inventory:
          $ref: '#/components/schemas/InventoryName'
        head_sha:
          $ref: '#/components/schemas/Sha'
        clean:
          type: [boolean, 'null']
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ApplySummary:
      type: object
      required: [apply_id, plan_id, status, inventory, head_sha, requested_at]
      additionalProperties: false
      properties:
        apply_id:
          $ref: '#/components/schemas/ApplyId'
        plan_id:
          oneOf:
            - $ref: '#/components/schemas/PlanId'
            - type: 'null'
        status:
          $ref: '#/components/schemas/ApplyStatus'
        inventory:
          $ref: '#/components/schemas/InventoryName'
        head_sha:
          $ref: '#/components/schemas/Sha'
        verdict:
          type: [string, 'null']
          enum: [match, diverged, incomplete, unverifiable, null]
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    PlanStatus:
      type: string
      enum: [requested, refused, running, interrupted, completed]
    ApplyStatus:
      type: string
      enum: [requested, refused, running, interrupted, completed]

    LockEventSummary:
      type: object
      required: [event_id, type, inventory, at]
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        type:
          type: string
          enum: [lock.acquired, lock.released, lock.taken_over]
        inventory:
          $ref: '#/components/schemas/InventoryName'
        at:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: [string, 'null']

    # ---- resources ---------------------------------------------------------------------------
    Change:
      type: object
      required: [change, state, plans, applies, approvals, locks, events_url]
      additionalProperties: false
      properties:
        change:
          $ref: '#/components/schemas/ChangeKey'
        state:
          type: string
          enum: [open, merged, closed, unknown]
          description: As last observed by ferry
        change_ref:
          oneOf:
            - $ref: '#/components/schemas/ChangeRef'
            - type: 'null'
        author:
          $ref: '#/components/schemas/Actor'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummary'
        applies:
          type: array
          items:
            $ref: '#/components/schemas/ApplySummary'
        approvals:
          type: array
          description: The approvals from the most recent gate evaluation
          items:
            $ref: '#/components/schemas/Approval'
        locks:
          type: array
          items:
            $ref: '#/components/schemas/LockEventSummary'
        events_url:
          type: string
          description: '`/events?change={number}&order=seq`'

    Plan:
      type: object
      required: [plan_id, status, change, inventory, head_sha, requested_by, trigger, requested_at]
      additionalProperties: false
      properties:
        plan_id:
          $ref: '#/components/schemas/PlanId'
        status:
          $ref: '#/components/schemas/PlanStatus'
        change:
          $ref: '#/components/schemas/ChangeKey'
        change_ref:
          oneOf:
            - $ref: '#/components/schemas/ChangeRef'
            - type: 'null'
        inventory:
          $ref: '#/components/schemas/InventoryName'
        head_sha:
          $ref: '#/components/schemas/Sha'
        base_sha:
          oneOf:
            - $ref: '#/components/schemas/Sha'
            - type: 'null'
        config_digest:
          oneOf:
            - $ref: '#/components/schemas/ConfigDigest'
            - type: 'null'
        scope:
          oneOf:
            - $ref: '#/components/schemas/Scope'
            - type: 'null'
        policy:
          oneOf:
            - $ref: '#/components/schemas/PolicyResult'
            - type: 'null'
        requested_by:
          $ref: '#/components/schemas/Actor'
        trigger:
          type: string
          enum: [autoplan, comment]
        refusal:
          oneOf:
            - $ref: '#/components/schemas/GateResult'
            - type: 'null'
        clean:
          type: [boolean, 'null']
        rc:
          type: [integer, 'null']
        totals:
          oneOf:
            - $ref: '#/components/schemas/Totals'
            - type: 'null'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/HostResult'
        record:
          type: [object, 'null']
          description: The plan record posted on the change
          additionalProperties: false
          properties:
            comment_url:
              type: string
              format: uri
            mac:
              type: [string, 'null']
              pattern: '^[0-9a-f]{64}$'
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        duration_ms:
          oneOf:
            - $ref: '#/components/schemas/DurationMs'
            - type: 'null'
        consumed_by:
          type: array
          items:
            $ref: '#/components/schemas/ApplyId'
        event_ids:
          type: array
          items:
            $ref: '#/components/schemas/EventId'

    Apply:
      type: object
      required: [apply_id, plan_id, status, change, inventory, head_sha, requested_by, gates, requested_at]
      additionalProperties: false
      properties:
        apply_id:
          $ref: '#/components/schemas/ApplyId'
        plan_id:
          description: The one plan this apply consumed. Null if refused before a plan was found, or if the plan record predates the audit.
          oneOf:
            - $ref: '#/components/schemas/PlanId'
            - type: 'null'
        status:
          $ref: '#/components/schemas/ApplyStatus'
        change:
          $ref: '#/components/schemas/ChangeKey'
        change_ref:
          oneOf:
            - $ref: '#/components/schemas/ChangeRef'
            - type: 'null'
        inventory:
          $ref: '#/components/schemas/InventoryName'
        head_sha:
          $ref: '#/components/schemas/Sha'
        requested_by:
          $ref: '#/components/schemas/Actor'
        approvals:
          type: array
          description: Every approval observed at the last gate evaluation, counted or not
          items:
            $ref: '#/components/schemas/Approval'
        gates:
          $ref: '#/components/schemas/GateResult'
        clean:
          type: [boolean, 'null']
        rc:
          type: [integer, 'null']
        totals:
          oneOf:
            - $ref: '#/components/schemas/Totals'
            - type: 'null'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/HostResult'
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        duration_ms:
          oneOf:
            - $ref: '#/components/schemas/DurationMs'
            - type: 'null'
        event_ids:
          type: array
          items:
            $ref: '#/components/schemas/EventId'

    Run:
      type: object
      required: [run_id, status, actor, inventory, mode, sha, issued_at]
      additionalProperties: false
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        status:
          type: string
          enum: [refused, active, finished, expired]
        actor:
          $ref: '#/components/schemas/Actor'
        inventory:
          $ref: '#/components/schemas/InventoryName'
        mode:
          type: string
          enum: [check, apply]
        sha:
          $ref: '#/components/schemas/Sha'
        limit:
          type: [string, 'null']
        playbook:
          type: string
        change_ref:
          oneOf:
            - $ref: '#/components/schemas/ChangeRef'
            - type: 'null'
        reason:
          oneOf:
            - $ref: '#/components/schemas/Text'
            - type: 'null'
        intent:
          oneOf:
            - $ref: '#/components/schemas/Text'
            - type: 'null'
        intent_ref:
          type: [string, 'null']
          format: uri
        certificate_serial:
          type: [string, 'null']
        certificate_expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        issued_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        result:
          type: [object, 'null']
          additionalProperties: false
          properties:
            ok:
              type: boolean
            counts:
              type: object
              additionalProperties: false
              properties:
                hosts:
                  type: integer
                changed_tasks:
                  type: integer
                failed_tasks:
                  type: integer
            asserted_by_client:
              type: boolean
              const: true
              description: The operator's machine ran Ansible. These numbers are its claim.
        verdict:
          $ref: '#/components/schemas/Verdict'
        event_ids:
          type: array
          items:
            $ref: '#/components/schemas/EventId'

    InventoryHistoryEntry:
      type: object
      required: [kind, at, event_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [plan, apply, drift, run, lock]
        at:
          $ref: '#/components/schemas/Timestamp'
        event_id:
          $ref: '#/components/schemas/EventId'
        plan_id:
          oneOf:
            - $ref: '#/components/schemas/PlanId'
            - type: 'null'
        apply_id:
          oneOf:
            - $ref: '#/components/schemas/ApplyId'
            - type: 'null'
        run_id:
          oneOf:
            - $ref: '#/components/schemas/RunId'
            - type: 'null'
        change:
          oneOf:
            - $ref: '#/components/schemas/ChangeKey'
            - type: 'null'
        sha:
          oneOf:
            - $ref: '#/components/schemas/Sha'
            - type: 'null'
        result:
          type: [string, 'null']
          description: ok, failed, refused, changed (drift) and so on
        actor:
          $ref: '#/components/schemas/Actor'

    InventoryHistoryPage:
      type: object
      required: [entries, next_cursor]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/InventoryHistoryEntry'
        next_cursor:
          type: [string, 'null']

    HostResultArtifact:
      type: object
      required: [schema, host, kind, tasks]
      additionalProperties: false
      properties:
        schema:
          type: string
          const: ferry.audit.host-result/v1
        host:
          type: string
        kind:
          type: string
          enum: [plan, apply, drift]
        truncated:
          type: boolean
        tasks:
          type: array
          items:
            type: object
            required: [key, status]
            additionalProperties: false
            properties:
              key:
                type: string
              task:
                type: string
              role:
                type: [string, 'null']
              status:
                type: string
                enum: [changed, failed, unreachable, blocked, skipped_in_check_mode]
              no_log:
                type: boolean
              diffs:
                type: array
                description: Redacted unified diffs, as rendered on the change
                items:
                  type: string
              msg:
                type: [string, 'null']
                description: Redacted

    ConfigArtifact:
      type: object
      required: [schema, digest, parsed, text]
      additionalProperties: false
      properties:
        schema:
          type: string
          const: ferry.audit.config/v1
        digest:
          $ref: '#/components/schemas/Hash'
        parsed:
          type: string
          description: The exact JSON the digest is the SHA-256 of (the parsed config, keys sorted)
        text:
          type: string
          description: '`ferry.yaml` from the default branch, as read'

    Checkpoint:
      type: object
      required: [schema, checkpoint_id, chain_id, seq, hash, at, key_id, signature]
      additionalProperties: false
      properties:
        schema:
          type: string
          const: ferry.audit.checkpoint/v1
        checkpoint_id:
          $ref: '#/components/schemas/CheckpointId'
        chain_id:
          $ref: '#/components/schemas/ChainId'
        seq:
          type: integer
          minimum: 1
        hash:
          $ref: '#/components/schemas/Hash'
        at:
          $ref: '#/components/schemas/Timestamp'
        previous_checkpoint_id:
          oneOf:
            - $ref: '#/components/schemas/CheckpointId'
            - type: 'null'
        key_id:
          type: [string, 'null']
          pattern: '^ed25519:[0-9a-f]{8}$'
          description: Null when no signing key is configured
        signature:
          type: [string, 'null']
          description: Base64 Ed25519 signature over the canonical JSON of this object without `signature`

    KeyList:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            type: object
            required: [key_id, alg, public_key]
            additionalProperties: false
            properties:
              key_id:
                type: string
                pattern: '^ed25519:[0-9a-f]{8}$'
              alg:
                type: string
                const: Ed25519
              public_key:
                type: string
                description: Base64 DER SubjectPublicKeyInfo
              first_used:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
              last_used:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
                description: Null for the current key

    # ---- events ------------------------------------------------------------------------------
    EventPage:
      type: object
      required: [events, next_cursor, head]
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type: [string, 'null']
        head:
          type: object
          description: The chain head when the page was read
          required: [seq, hash]
          additionalProperties: false
          properties:
            seq:
              type: integer
              minimum: 1
            hash:
              $ref: '#/components/schemas/Hash'

    EventType:
      type: string
      enum:
        - audit.genesis
        - service.started
        - switch.changed
        - webhook.received
        - webhook.rejected
        - plan.requested
        - plan.refused
        - plan.started
        - plan.completed
        - approval.observed
        - apply.requested
        - apply.refused
        - apply.started
        - apply.completed
        - lock.acquired
        - lock.released
        - lock.taken_over
        - drift.completed
        - run.refused
        - run.issued
        - run.finished
        - run.expired
        - audit.checkpoint
        - audit.redacted
        - audit.pruned

    EventEnvelope:
      description: |
        The fields every event has. `Event` selects the `data` schema by `type`.

        `hash` = `sha256:` + hex(SHA-256(canonical JSON of the event without `hash`)).
        Canonical JSON: keys sorted, no insignificant whitespace, UTF-8, no floats. For ferry's
        events this equals RFC 8785 (JCS).

        In the API, an `actor` is shown with its identity unless erased. In the chain, and in
        exports without identities, an actor has only `id`, `kind`, `via` and `on_behalf_of`.
        The hash is computed over that form, and `Text` fields over `commitment` and `redacted`
        only.
      type: object
      required: [schema, chain_id, seq, id, type, at, ferry_version, actor, data, prev_hash, hash]
      properties:
        schema:
          type: string
          const: ferry.audit/v1
        chain_id:
          $ref: '#/components/schemas/ChainId'
        seq:
          type: integer
          minimum: 1
        id:
          $ref: '#/components/schemas/EventId'
        type:
          $ref: '#/components/schemas/EventType'
        at:
          $ref: '#/components/schemas/Timestamp'
        ferry_version:
          type: string
        change:
          oneOf:
            - $ref: '#/components/schemas/ChangeKey'
            - type: 'null'
        change_ref:
          oneOf:
            - $ref: '#/components/schemas/ChangeRefValue'
            - type: 'null'
        inventory:
          oneOf:
            - $ref: '#/components/schemas/InventoryName'
            - type: 'null'
        plan_id:
          oneOf:
            - $ref: '#/components/schemas/PlanId'
            - type: 'null'
        apply_id:
          oneOf:
            - $ref: '#/components/schemas/ApplyId'
            - type: 'null'
        run_id:
          oneOf:
            - $ref: '#/components/schemas/RunId'
            - type: 'null'
        actor:
          oneOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
        data:
          type: object
          description: The type-specific payload, selected by `type`
        prev_hash:
          $ref: '#/components/schemas/Hash'
        hash:
          $ref: '#/components/schemas/Hash'
    Event:
      description: One event, with `data` selected by `type`. See `EventEnvelope` for the hash rules.
      oneOf:
        - $ref: '#/components/schemas/EventPlanRequested'
        - $ref: '#/components/schemas/EventPlanRefused'
        - $ref: '#/components/schemas/EventPlanStarted'
        - $ref: '#/components/schemas/EventPlanCompleted'
        - $ref: '#/components/schemas/EventApprovalObserved'
        - $ref: '#/components/schemas/EventApplyRequested'
        - $ref: '#/components/schemas/EventApplyRefused'
        - $ref: '#/components/schemas/EventApplyStarted'
        - $ref: '#/components/schemas/EventApplyCompleted'
        - $ref: '#/components/schemas/EventLock'
        - $ref: '#/components/schemas/EventDriftCompleted'
        - $ref: '#/components/schemas/EventRun'
        - $ref: '#/components/schemas/EventWebhookReceived'
        - $ref: '#/components/schemas/EventWebhookRejected'
        - $ref: '#/components/schemas/EventAudit'
      discriminator:
        propertyName: type
        mapping:
          plan.requested: '#/components/schemas/EventPlanRequested'
          plan.refused: '#/components/schemas/EventPlanRefused'
          plan.started: '#/components/schemas/EventPlanStarted'
          plan.completed: '#/components/schemas/EventPlanCompleted'
          approval.observed: '#/components/schemas/EventApprovalObserved'
          apply.requested: '#/components/schemas/EventApplyRequested'
          apply.refused: '#/components/schemas/EventApplyRefused'
          apply.started: '#/components/schemas/EventApplyStarted'
          apply.completed: '#/components/schemas/EventApplyCompleted'
          lock.acquired: '#/components/schemas/EventLock'
          lock.released: '#/components/schemas/EventLock'
          lock.taken_over: '#/components/schemas/EventLock'
          drift.completed: '#/components/schemas/EventDriftCompleted'
          run.refused: '#/components/schemas/EventRun'
          run.issued: '#/components/schemas/EventRun'
          run.finished: '#/components/schemas/EventRun'
          run.expired: '#/components/schemas/EventRun'
          webhook.received: '#/components/schemas/EventWebhookReceived'
          webhook.rejected: '#/components/schemas/EventWebhookRejected'
          audit.genesis: '#/components/schemas/EventAudit'
          service.started: '#/components/schemas/EventAudit'
          switch.changed: '#/components/schemas/EventAudit'
          audit.checkpoint: '#/components/schemas/EventAudit'
          audit.redacted: '#/components/schemas/EventAudit'
          audit.pruned: '#/components/schemas/EventAudit'
    EventPlanRequested:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: plan.requested
            data:
              $ref: '#/components/schemas/EventDataPlanRequested'
    EventPlanRefused:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: plan.refused
            data:
              $ref: '#/components/schemas/EventDataRefused'
    EventPlanStarted:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: plan.started
            data:
              $ref: '#/components/schemas/EventDataPlanStarted'
    EventPlanCompleted:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: plan.completed
            data:
              $ref: '#/components/schemas/EventDataRunCompleted'
    EventApprovalObserved:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: approval.observed
            data:
              $ref: '#/components/schemas/EventDataApprovalObserved'
    EventApplyRequested:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: apply.requested
            data:
              $ref: '#/components/schemas/EventDataApplyRequested'
    EventApplyRefused:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: apply.refused
            data:
              $ref: '#/components/schemas/EventDataRefused'
    EventApplyStarted:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: apply.started
            data:
              $ref: '#/components/schemas/EventDataApplyStarted'
    EventApplyCompleted:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: apply.completed
            data:
              $ref: '#/components/schemas/EventDataApplyCompleted'
    EventLock:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              enum: [lock.acquired, lock.released, lock.taken_over]
            data:
              $ref: '#/components/schemas/EventDataLock'
