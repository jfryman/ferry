[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferry"
version = "0.4.2"
description = "Atlantis-style plan/apply/drift executor for Ansible"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0.4"]

[project.optional-dependencies]
service = ["cryptography>=50.0.2"]
test = ["pytest>=9.2.0", "cryptography>=50.0.2"]

[project.scripts]
ferry = "ferry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ferry = ["ansible/callback_plugins/*.py", "ansible/playbooks/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
