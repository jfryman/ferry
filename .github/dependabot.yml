# Dependabot version updates. Security alerts are separate (repository settings).
version: 2
updates:
  # pyproject.toml: runtime, service and test dependency floors.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Workflow actions are pinned by commit SHA with a version comment; Dependabot bumps both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # The service image's base (Dockerfile) and the lab's SSH target. The lab's OpenBao image is an
  # ARG default (deploy/local/operator.Dockerfile, up.sh): bump it by hand with OpenBao releases.
  - package-ecosystem: "docker"
    directories: ["/", "/deploy/local/target"]
    schedule:
      interval: "weekly"
